<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhD Map: European Astrophysics & Cosmology PhD Navigator</title>
<meta name="description" content="Interactive map and application tracker for European astrophysics and cosmology PhD openings, universities, and research supervisors.">
<link rel="icon" href="data:,">
<script>try{var t=localStorage.getItem('phdmap.theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark')}catch(e){}</script>
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preload" href="data.json" as="fetch" crossorigin="anonymous">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{
  --font-sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --bg:#f8fafc;--surface:#fff;--surface-subtle:#f1f5f9;--border:#cbd5e1;--border-subtle:#e2e8f0;
  --text:#0f172a;--text-muted:#475569;--text-subtle:#64748b;
  --primary:#1d4ed8;--primary-subtle:#eff6ff;--primary-border:#bfdbfe;
  --amber:#b45309;--amber-bg:#fef3c7;--emerald:#15803d;--rose:#b91c1c;--rose-bg:#fee2e2;--purple:#6b21a8;--purple-bg:#f3e8ff;
  --c-openings:#ea580c;--c-universities:#2563eb;--c-supervisors:#16a34a;
  --drawer-bg:#0b1220;--drawer-surface:#121c32;--drawer-border:#223354;--drawer-text:#f8fafc;--drawer-muted:#94a3b8;
}
html.dark{
  --bg:#090e17;--surface:#0f172a;--surface-subtle:#172238;--border:#334155;--border-subtle:#1e293b;
  --text:#f8fafc;--text-muted:#cbd5e1;--text-subtle:#94a3b8;
  --primary:#3b82f6;--primary-subtle:#172554;--primary-border:#1e3a8a;
  --amber:#fbbf24;--amber-bg:#451a03;--emerald:#4ade80;--rose:#f87171;--rose-bg:#450a0a;--purple:#c084fc;--purple-bg:#3b0764;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}

header{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:30;flex-shrink:0}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:-.02em}
.brand-badge{width:26px;height:26px;background:var(--primary);color:#fff;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px}
.brand-sub{font-size:11px;color:var(--text-subtle);font-weight:500;font-family:var(--font-mono)}
nav.tab-group{display:flex;background:var(--surface-subtle);padding:3px;border-radius:8px;border:1px solid var(--border-subtle);gap:2px}
.tab-btn{border:none;background:transparent;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text-muted);border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{background:var(--surface);color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.tab-count{font-family:var(--font-mono);font-size:10px;padding:1px 6px;border-radius:999px;background:var(--border-subtle);font-weight:700}
.tab-btn.active .tab-count{background:var(--primary-subtle);color:var(--primary)}
.btn-icon{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:6px;color:var(--text-muted);cursor:pointer;display:flex}
.btn-icon:hover{background:var(--surface-subtle);color:var(--text)}

.filter-bar{background:var(--surface);border-bottom:1px solid var(--border);padding:8px 16px;display:flex;align-items:center;gap:10px;z-index:20;flex-shrink:0}
.search-box{flex:1;position:relative;min-width:200px}
.search-input{width:100%;padding:6px 30px 6px 10px;background:var(--surface-subtle);border:1px solid var(--border);border-radius:6px;font-size:12px;color:var(--text);outline:none}
.search-input:focus{border-color:var(--primary);background:var(--surface)}
.clear-search{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--text-subtle);cursor:pointer;font-size:14px;display:none}
.country-select{background:var(--surface-subtle);border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;outline:none}
.btn-filter-trigger{display:flex;align-items:center;gap:6px;background:var(--surface-subtle);border:1px solid var(--border);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:600;color:var(--text);cursor:pointer}
.btn-filter-trigger.has-active{background:var(--primary-subtle);border-color:var(--primary-border);color:var(--primary)}
.filter-count-badge{background:var(--primary);color:#fff;border-radius:999px;font-family:var(--font-mono);font-size:10px;padding:1px 5px}
.filter-popover{position:absolute;top:92px;right:16px;width:320px;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 25px rgba(0,0,0,.15);padding:14px;z-index:100;display:none;flex-direction:column;gap:12px}
.filter-popover.open{display:flex}
.filter-field label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--text-subtle);margin-bottom:4px}
.filter-field select{width:100%;padding:6px 8px;background:var(--surface-subtle);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px}
.checkbox-row{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer}
.checkbox-row input{cursor:pointer;accent-color:var(--primary)}

main{flex:1;display:flex;min-height:0;position:relative}
.explorer-container{display:flex;flex:1;min-height:0;width:100%}
#map{flex:1;min-height:0;position:relative;background:#cde0f1}
.map-controls-overlay{position:absolute;top:10px;left:50px;z-index:1000}
.map-style-switch{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px;display:flex;gap:2px;box-shadow:0 2px 6px rgba(0,0,0,.1)}
.map-style-btn{border:none;background:transparent;padding:3px 8px;font-size:11px;font-weight:600;color:var(--text-muted);border-radius:4px;cursor:pointer}
.map-style-btn.active{background:var(--primary);color:#fff}
.list-container{width:480px;max-width:50%;border-left:1px solid var(--border);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.list-header{padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--border);font-size:11px;color:var(--text-muted)}
.cards-scroll{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.pin-list{display:flex;flex-direction:column;gap:3px;max-height:180px;overflow-y:auto;margin-top:6px}
.pin-item{text-align:left;border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;font:600 11px var(--font-sans);padding:4px 6px;border-radius:4px;cursor:pointer}
.pin-item:hover{background:#1d4ed8;color:#fff}
.empty-msg{text-align:center;padding:40px 10px;color:var(--text-subtle)}

.record-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px;cursor:pointer}
.record-card:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(0,0,0,.06)}
.card-title{font-weight:700;font-size:13px;line-height:1.3;margin-bottom:4px}
.card-uni{font-size:12px;color:var(--text-muted);margin-bottom:8px}
.tag-row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:10px;font-family:var(--font-mono);font-weight:600;padding:2px 6px;border-radius:4px;background:var(--surface-subtle);border:1px solid var(--border-subtle);color:var(--text-muted)}
.tag.deadline-open{background:var(--amber-bg);color:var(--amber);border-color:var(--amber)}
.tag.deadline-urgent{background:var(--rose-bg);color:var(--rose);border-color:var(--rose)}
.tag.deadline-passed{color:var(--text-subtle)}
.tag.stage-badge{background:var(--purple-bg);color:var(--purple);border-color:var(--purple)}

.tracker-view{flex:1;overflow-y:auto;padding:16px;display:none;flex-direction:column;gap:16px;max-width:1400px;margin:0 auto;width:100%}
.tracker-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.metric-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px}
.metric-label{font-size:10px;font-family:var(--font-mono);text-transform:uppercase;color:var(--text-subtle)}
.metric-val{font-size:22px;font-weight:800;font-family:var(--font-mono);margin-top:2px}
.kanban-board{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;align-items:start}
.kanban-col{background:var(--surface-subtle);border:1px solid var(--border);border-radius:8px;padding:10px;min-height:420px;display:flex;flex-direction:column;gap:8px}
.kanban-col-head{font-weight:700;font-size:12px;padding-bottom:6px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.kanban-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:10px;font-size:11px;display:flex;flex-direction:column;gap:6px;cursor:grab}
.kanban-card:hover{border-color:var(--primary)}
.kanban-card[data-type]{border-left:4px solid var(--tc)}
.kanban-card[data-type=openings]{--tc:var(--c-openings)}
.kanban-card[data-type=universities]{--tc:var(--c-universities)}
.kanban-card[data-type=supervisors]{--tc:var(--c-supervisors)}
.kanban-type{font-family:var(--font-mono);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--tc)}
.kanban-card.dragging{opacity:.4}
.kanban-col.drag-over{outline:2px dashed var(--primary);outline-offset:-2px;background:var(--primary-subtle)}
.kanban-card[data-type]{background:color-mix(in srgb,var(--tc) 9%,var(--surface))}
.type-legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--text-muted)}
.type-legend span{display:inline-flex;align-items:center;gap:5px}
.type-legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.celebrate-banner{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:3001;background:#16a34a;color:#fff;font-weight:800;font-size:15px;padding:10px 22px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);pointer-events:none;animation:popIn .4s cubic-bezier(.2,1.4,.4,1),fadeOut .5s ease-in 2.6s forwards}
@keyframes popIn{from{transform:translateX(-50%) scale(.4);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
@keyframes fadeOut{to{opacity:0}}
.kanban-actions{display:flex;justify-content:space-between;border-top:1px solid var(--border-subtle);padding-top:6px;margin-top:2px}
.btn-kanban{background:none;border:none;color:var(--text-subtle);cursor:pointer;font-size:12px;padding:2px;border-radius:4px}
.btn-kanban:hover{color:var(--text);background:var(--surface-subtle)}
.btn-remove-stage{color:var(--rose)!important;font-weight:600}

.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:2000;display:none;justify-content:flex-end}
.drawer-overlay.open{display:flex}
.drawer{width:540px;max-width:100%;height:100%;background:var(--drawer-bg);color:var(--drawer-text);border-left:1px solid var(--drawer-border);display:flex;flex-direction:column;box-shadow:-10px 0 30px rgba(0,0,0,.5);animation:slideIn .2s ease-out}
@keyframes slideIn{from{transform:translateX(100%)}to{transform:none}}
.drawer-head{padding:16px;background:linear-gradient(180deg,#101a30,#0d1627);border-bottom:1px solid var(--drawer-border);position:relative}
.drawer-close{position:absolute;top:14px;right:14px;background:transparent;border:none;color:var(--drawer-muted);cursor:pointer;font-size:18px;padding:4px;border-radius:4px}
.drawer-close:hover{color:#fff;background:rgba(255,255,255,.1)}
.drawer-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--amber);margin-bottom:4px}
.drawer-title{font-size:18px;font-weight:800;line-height:1.25;color:#fff;padding-right:30px}
.drawer-sub{font-size:12px;color:var(--drawer-muted);margin-top:4px}
.drawer-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.btn-drawer-pri{background:#2563eb;color:#fff;text-decoration:none;font-weight:600;font-size:11px;padding:6px 12px;border-radius:6px;display:inline-flex;align-items:center;gap:4px}
.btn-drawer-pri:hover{background:#1d4ed8}
.btn-remove-stage-drawer{background:#450a0a;color:#fca5a5;border:1px solid #7f1d1d;font-size:11px;font-weight:600;padding:6px 12px;border-radius:6px;cursor:pointer;display:none;align-items:center;gap:4px}
.btn-remove-stage-drawer:hover{background:#7f1d1d;color:#fff}
.drawer-nav{display:flex;background:#090e1a;padding:4px 16px;border-bottom:1px solid var(--drawer-border);gap:8px}
.drawer-nav-btn{background:transparent;border:none;color:var(--drawer-muted);font-size:12px;font-weight:600;padding:8px 12px;border-bottom:2px solid transparent;cursor:pointer}
.drawer-nav-btn:hover{color:#fff}
.drawer-nav-btn.active{color:#fff;border-bottom-color:#2563eb}
.drawer-body{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
.section-card{background:var(--drawer-surface);border:1px solid var(--drawer-border);border-radius:8px;padding:14px}
.section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--drawer-muted);margin-bottom:8px}
.fact-grid{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;font-size:12px}
.fact-label{color:var(--drawer-muted);font-weight:500}
.body-text{font-size:12px;line-height:1.6;color:#cbd5e1}

@media (max-width:850px){
  .explorer-container{flex-direction:column}
  .list-container{width:100%;max-width:100%;height:50vh;border-left:none;border-top:1px solid var(--border)}
  .kanban-board{grid-template-columns:1fr}
  .drawer{width:100%}
}
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-badge">★</div>
    <div><span>PhD Map</span> <span class="brand-sub">European Astrophysics & Cosmology</span></div>
  </div>
  <nav class="tab-group" role="tablist">
    <button class="tab-btn active" data-tab="openings">Openings <span class="tab-count" id="count-openings">0</span></button>
    <button class="tab-btn" data-tab="universities">Universities <span class="tab-count" id="count-universities">0</span></button>
    <button class="tab-btn" data-tab="supervisors">Supervisors <span class="tab-count" id="count-supervisors">0</span></button>
    <button class="tab-btn" data-tab="tracker">Tracker <span class="tab-count" id="count-tracker">0</span></button>
  </nav>
  <button id="theme-toggle" class="btn-icon" title="Toggle Light/Dark Theme">◐</button>
</header>

<div class="filter-bar">
  <div class="search-box">
    <input type="text" id="search-input" class="search-input" placeholder="Search openings, universities, professors, research areas...">
    <button id="clear-search" class="clear-search">✕</button>
  </div>
  <select id="country-select" class="country-select" aria-label="Filter by Country">
    <option value="">All Countries</option>
  </select>
  <div style="position:relative">
    <button id="filter-btn" class="btn-filter-trigger">
      <span>⚙ Filters</span>
      <span id="active-filter-badge" class="filter-count-badge" style="display:none">0</span>
    </button>
    <div id="filter-popover" class="filter-popover">
      <div class="filter-field">
        <label>Subfield / Topic</label>
        <select id="subfield-select"><option value="">All Research Subfields</option></select>
      </div>
      <label class="checkbox-row"><input type="checkbox" id="check-hide-closed" checked><span>Hide closed / passed deadlines</span></label>
      <label class="checkbox-row"><input type="checkbox" id="check-funded-only"><span>Fully funded positions only</span></label>
      <label class="checkbox-row"><input type="checkbox" id="check-taking-students"><span>Only faculty currently taking students</span></label>
      <div style="display:flex;justify-content:flex-end;margin-top:6px">
        <button id="reset-filters-btn" style="background:none;border:none;color:var(--primary);font-size:11px;font-weight:600;cursor:pointer">Reset all filters</button>
      </div>
    </div>
  </div>
</div>

<main>
  <div id="explorer-view" class="explorer-container">
    <div id="map">
      <div class="map-controls-overlay">
        <div class="map-style-switch">
          <button class="map-style-btn active" data-style="street">Street Map</button>
          <button class="map-style-btn" data-style="satellite">Satellite</button>
        </div>
      </div>
    </div>
    <div class="list-container">
      <div class="list-header"><span id="results-count-label">Loading…</span></div>
      <div id="cards-container" class="cards-scroll"></div>
    </div>
  </div>

  <div id="tracker-view" class="tracker-view">
    <div class="tracker-metrics">
      <div class="metric-card"><div class="metric-label">Total Applications</div><div class="metric-val" id="metric-total">0</div></div>
      <div class="metric-card"><div class="metric-label" style="color:var(--primary)">Contacted / Discussion</div><div class="metric-val" style="color:var(--primary)" id="metric-contacted">0</div></div>
      <div class="metric-card"><div class="metric-label" style="color:var(--amber)">Interviews</div><div class="metric-val" style="color:var(--amber)" id="metric-interviews">0</div></div>
      <div class="metric-card"><div class="metric-label" style="color:var(--emerald)">Offers</div><div class="metric-val" style="color:var(--emerald)" id="metric-offers">0</div></div>
    </div>
    <div class="type-legend"><span><i style="background:var(--c-openings)"></i>Opening</span><span><i style="background:var(--c-universities)"></i>University</span><span><i style="background:var(--c-supervisors)"></i>Supervisor</span></div>
    <div class="kanban-board" id="kanban-board"></div>
  </div>
</main>

<div id="drawer-overlay" class="drawer-overlay">
  <div class="drawer">
    <div class="drawer-head">
      <button id="drawer-close-btn" class="drawer-close" title="Close">✕</button>
      <div class="drawer-type" id="d-type"></div>
      <h2 class="drawer-title" id="d-title"></h2>
      <div class="drawer-sub" id="d-uni"></div>
      <div class="drawer-actions">
        <a id="d-apply-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn-drawer-pri">Apply / Portal ↗</a>
        <button id="d-remove-stage-btn" class="btn-remove-stage-drawer">🗑 Remove from Stage</button>
      </div>
    </div>
    <div class="drawer-nav">
      <button class="drawer-nav-btn active" data-dtab="overview">Overview</button>
      <button class="drawer-nav-btn" data-dtab="research" id="dtab-research-btn">Research Work</button>
      <button class="drawer-nav-btn" data-dtab="tracker">Stage & Notes</button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
'use strict';

const Config = {
  storageKeyTracker: 'phdmap.tracker.v1',
  storageKeyTheme: 'phdmap.theme',
  dataUrl: 'data.json', // relative path so it works on GitHub Pages project sites
  stages: [
    { key: 'saved', label: 'Considering', color: '#9333ea' },
    { key: 'emailed', label: 'Contacted', color: '#2563eb' },
    { key: 'replied', label: 'In Discussion', color: '#0284c7' },
    { key: 'interview', label: 'Interview', color: '#d97706' },
    { key: 'offer', label: 'Offer', color: '#16a34a' },
    { key: 'declined', label: 'Declined', color: '#dc2626' }
  ],
  markerColors: { openings: '#ea580c', universities: '#2563eb', supervisors: '#16a34a' },
  mapLayers: {
    street: {
      base: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
      attr: 'Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, METI, OpenStreetMap contributors'
    },
    satellite: {
      base: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      overlay: 'https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',
      attr: 'Esri, Maxar, Earthstar Geographics'
    }
  }
};

const Celebrate = {
  run() {
    const banner = document.createElement('div');
    banner.className = 'celebrate-banner';
    banner.textContent = '🎉 Congratulations on the offer!';
    document.body.appendChild(banner);
    setTimeout(() => banner.remove(), 3200);
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;

    const cv = document.createElement('canvas');
    cv.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3000';
    const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
    cv.width = W * dpr; cv.height = H * dpr;
    document.body.appendChild(cv);
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);
    const colors = ['#f43f5e', '#f59e0b', '#22c55e', '#3b82f6', '#a855f7', '#facc15', '#14b8a6'];
    const bits = Array.from({ length: 170 }, () => ({
      x: W / 2 + (Math.random() - .5) * W * .3, y: H * .35,
      vx: (Math.random() - .5) * 16, vy: -Math.random() * 14 - 4,
      w: 6 + Math.random() * 6, h: 4 + Math.random() * 5,
      rot: Math.random() * 6.28, vr: (Math.random() - .5) * .4,
      c: colors[(Math.random() * colors.length) | 0]
    }));
    const t0 = performance.now();
    (function frame(now) {
      const t = now - t0;
      ctx.clearRect(0, 0, W, H);
      ctx.globalAlpha = t > 2600 ? Math.max(0, 1 - (t - 2600) / 600) : 1;
      bits.forEach(b => {
        b.vy += .35; b.vx *= .99; b.x += b.vx; b.y += b.vy; b.rot += b.vr;
        ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.rot);
        ctx.fillStyle = b.c; ctx.fillRect(-b.w / 2, -b.h / 2, b.w, b.h); ctx.restore();
      });
      if (t < 3200) requestAnimationFrame(frame); else cv.remove();
    })(t0);
  }
};

const Store = {
  dataset: { openings: [], universities: [], supervisors: [] },
  uniById: new Map(),
  supByUni: new Map(),
  byId: new Map(),
  tracker: {},

  init() {
    try { this.tracker = JSON.parse(localStorage.getItem(Config.storageKeyTracker)) || {}; }
    catch (e) { this.tracker = {}; }
  },

  saveTracker() {
    try { localStorage.setItem(Config.storageKeyTracker, JSON.stringify(this.tracker)); }
    catch (e) { console.warn('LocalStorage save failed', e); }
  },

  updateStage(id, status) {
    const prev = this.tracker[id]?.status;
    if (!status || status === 'none') delete this.tracker[id];
    else this.tracker[id] = { ...(this.tracker[id] || {}), status, updatedAt: new Date().toISOString() };
    this.saveTracker();
    App.renderTracker();
    App.updateCounts();
    App.refreshCards();
    if (Drawer.currentRecord && Drawer.currentRecord.id === id) Drawer.render(Drawer.currentRecord);
    if (status === 'offer' && prev !== 'offer') Celebrate.run();
  },

  // One-time lookups so filtering/searching never scans arrays
  buildIndexes() {
    const d = this.dataset;
    const dict = d.subfieldDict || [];
    this.uniById = new Map(d.universities.map(u => [u.id, u]));
    this.supByUni = new Map();
    this.byId = new Map();
    ['universities', 'supervisors', 'openings'].forEach(k => d[k].forEach(r => {
      r._t = k; // explicit record type
      if (r.subfields) r.subfields = r.subfields.map(i => dict[i]); // data.json stores subfields as dictionary indexes
      this.byId.set(r.id, r);
    }));
    d.supervisors.forEach(sp => {
      if (!this.supByUni.has(sp.universityId)) this.supByUni.set(sp.universityId, []);
      this.supByUni.get(sp.universityId).push(sp);
    });
  },

  // Search text is built on first search, not at load
  hay(r) {
    if (r._hay === undefined) {
      const uni = Utils.getUniversity(r);
      r._hay = [r.title, r.name, r.group, uni?.name, uni?.city, uni?.country, ...(r.subfields || []),
        r.researchWork?.description, r.researchWork?.summary].filter(Boolean).join(' ').toLowerCase();
    }
    return r._hay;
  },

  async fetchDataset() {
    try {
      const res = await fetch(Config.dataUrl);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      this.dataset = await res.json();
      this.buildIndexes();
      return true;
    } catch (err) {
      console.error('Failed to load ' + Config.dataUrl, err);
      return false;
    }
  }
};

const TYPE_LABEL = { openings: 'Opening', universities: 'University', supervisors: 'Supervisor' };

const Utils = {
  escape(str) {
    if (!str) return '';
    return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  },
  // Whole days from today (local) to a YYYY-MM-DD deadline; negative if passed
  daysLeft(deadline) {
    const t = new Date();
    const today = Date.UTC(t.getFullYear(), t.getMonth(), t.getDate());
    return Math.round((Date.parse(deadline) - today) / 86400000);
  },

  daysLeftText(deadline) {
    const n = this.daysLeft(deadline);
    if (isNaN(n)) return '';
    if (n < 0) return 'closed';
    if (n === 0) return 'today';
    return n === 1 ? '1 day left' : n + ' days left';
  },

  getUniversity(record) {
    if (!record) return null;
    if (record._t === 'universities') return record;
    return Store.uniById.get(record.universityId) || null;
  }
};

const MapModule = {
  map: null, markerLayer: null, baseTile: null, overlayTile: null,
  markerById: new Map(), selected: null,

  init() {
    this.map = L.map('map', { center: [50.8, 11.5], zoom: 4, minZoom: 3, maxZoom: 18, preferCanvas: true });
    this.setLayer('street');
    this.markerLayer = L.layerGroup().addTo(this.map);

    document.querySelectorAll('.map-style-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.map-style-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.setLayer(btn.dataset.style);
      });
    });
  },

  setLayer(style) {
    const cfg = Config.mapLayers[style];
    if (!cfg) return;
    if (this.baseTile) this.map.removeLayer(this.baseTile);
    if (this.overlayTile) this.map.removeLayer(this.overlayTile);
    this.baseTile = L.tileLayer(cfg.base, { maxZoom: 19, attribution: cfg.attr }).addTo(this.map);
    this.overlayTile = cfg.overlay ? L.tileLayer(cfg.overlay, { maxZoom: 19 }).addTo(this.map) : null;
  },

  renderMarkers(records, tab) {
    this.markerLayer.clearLayers();
    this.markerById.clear();
    this.selected = null;
    const fillColor = Config.markerColors[tab] || '#2563eb';
    const groups = {};

    records.forEach(r => {
      const uni = Utils.getUniversity(r);
      if (!uni || uni.lat == null || uni.lng == null) return;
      const key = uni.lat.toFixed(4) + ',' + uni.lng.toFixed(4);
      (groups[key] = groups[key] || { lat: uni.lat, lng: uni.lng, uni, items: [] }).items.push(r);
    });

    Object.values(groups).forEach(g => {
      const marker = L.circleMarker([g.lat, g.lng], {
        radius: Math.min(16, 7 + Math.log2(g.items.length + 1) * 3),
        fillColor, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.85
      });
      const items = g.items;
      marker.bindPopup(() => this.buildPopup(g, tab), { minWidth: 210, maxWidth: 300 }); // DOM built only when opened
      marker.on('click', () => { if (items.length === 1) Drawer.open(items[0]); });
      items.forEach(item => this.markerById.set(item.id, marker));
      marker.addTo(this.markerLayer);
    });
  },

  buildPopup(g, tab) {
    const nameOf = r => r.title || r.name || '';
    const items = g.items.slice().sort((a, b) => nameOf(a).localeCompare(nameOf(b)));
    const el = document.createElement('div');
    el.style.cssText = 'font-size:12px;line-height:1.4';
    el.innerHTML = `
      <strong style="font-size:13px;color:#0f172a">${Utils.escape(g.uni.name)}</strong>
      <div style="color:#64748b;font-size:11px">${g.uni.city ? Utils.escape(g.uni.city) + ', ' : ''}${Utils.escape(g.uni.country)}</div>
      <div style="margin-top:6px;font-weight:600;color:#1d4ed8">${items.length} ${tab.slice(0, -1)}${items.length === 1 ? '' : 's'} here${items.length > 1 ? ' · pick one:' : ''}</div>`;
    if (!(tab === 'universities' && items.length === 1)) {
      const list = document.createElement('div');
      list.className = 'pin-list';
      items.forEach(item => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pin-item';
        b.textContent = nameOf(item);
        b.addEventListener('click', () => Drawer.open(item));
        list.appendChild(b);
      });
      el.appendChild(list);
    }
    return el;
  },

  // Fly to the pin of a record and highlight it
  focus(record) {
    if (!this.map || App.activeTab === 'tracker') return;
    const uni = Utils.getUniversity(record);
    if (!uni || uni.lat == null || uni.lng == null) return;
    this.clearHighlight();
    const marker = this.markerById.get(record.id);
    if (marker) {
      marker.setStyle({ color: '#facc15', weight: 4 });
      marker.bringToFront();
      this.selected = marker;
    }
    this.map.flyTo([uni.lat, uni.lng], Math.max(this.map.getZoom(), 6), { duration: 0.6 });
  },

  clearHighlight() {
    if (this.selected) this.selected.setStyle({ color: '#ffffff', weight: 2 });
    this.selected = null;
  }
};

const FilterEngine = {
  state: { search: '', country: '', subfield: '', hideClosed: true, fundedOnly: false, takingStudents: false },

  init() {
    const $ = id => document.getElementById(id);
    const searchInput = $('search-input'), clearBtn = $('clear-search'), popover = $('filter-popover'), filterBtn = $('filter-btn');
    const subfieldSelect = $('subfield-select'), hideClosed = $('check-hide-closed'), funded = $('check-funded-only'), taking = $('check-taking-students');

    let timer;
    searchInput.addEventListener('input', e => {
      this.state.search = e.target.value.toLowerCase().trim();
      clearBtn.style.display = this.state.search ? 'block' : 'none';
      clearTimeout(timer);
      timer = setTimeout(() => App.applyFilters(), 150);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      this.state.search = '';
      clearBtn.style.display = 'none';
      App.applyFilters();
    });
    $('country-select').addEventListener('change', e => { this.state.country = e.target.value; App.applyFilters(); });

    filterBtn.addEventListener('click', e => { e.stopPropagation(); popover.classList.toggle('open'); });
    document.addEventListener('click', e => {
      if (!popover.contains(e.target) && !filterBtn.contains(e.target)) popover.classList.remove('open');
    });

    const bind = (el, key, prop) => el.addEventListener('change', e => {
      this.state[key] = e.target[prop];
      this.updateBadge();
      App.applyFilters();
    });
    bind(subfieldSelect, 'subfield', 'value');
    bind(hideClosed, 'hideClosed', 'checked');
    bind(funded, 'fundedOnly', 'checked');
    bind(taking, 'takingStudents', 'checked');

    $('reset-filters-btn').addEventListener('click', () => {
      Object.assign(this.state, { subfield: '', hideClosed: true, fundedOnly: false, takingStudents: false });
      subfieldSelect.value = '';
      hideClosed.checked = true;
      funded.checked = false;
      taking.checked = false;
      this.updateBadge();
      App.applyFilters();
    });
  },

  updateBadge() {
    const s = this.state;
    const count = (s.subfield ? 1 : 0) + (s.fundedOnly ? 1 : 0) + (s.takingStudents ? 1 : 0) + (s.hideClosed ? 0 : 1);
    const badge = document.getElementById('active-filter-badge');
    badge.textContent = count;
    badge.style.display = count ? 'inline-block' : 'none';
    document.getElementById('filter-btn').classList.toggle('has-active', count > 0);
  },

  filterRecords(records, tab) {
    const today = new Date().toISOString().slice(0, 10);
    const s = this.state;
    const sub = s.subfield.toLowerCase();

    return records.filter(r => {
      const uni = Utils.getUniversity(r);

      if (s.country && uni?.country !== s.country) return false;
      if (tab === 'openings' && s.hideClosed && (r.status === 'closed' || (r.deadline && r.deadline < today))) return false;

      if (s.fundedOnly) {
        if (tab === 'openings' && r.funding) {
          const f = r.funding.toLowerCase();
          if (!f.includes('fully') && !f.includes('funded')) return false;
        }
        if (tab === 'universities' && !/fully|funded|full funding/i.test(r.funding || '')) return false;
      }

      if (tab === 'supervisors' && s.takingStudents && !r.takingStudents) return false;

      if (sub) {
        const subs = r.subfields || uni?.subfields || [];
        if (!subs.some(x => x.toLowerCase().includes(sub))) return false;
      }

      if (s.search && !Store.hay(r).includes(s.search)) return false;
      return true;
    });
  }
};

    });

const App = {
  activeTab: 'openings',
  filteredRecords: [],
  rendered: 0,
  CARD_BATCH: 60,

  async init() {
    const dataPromise = Store.fetchDataset(); // start download immediately, in parallel with setup
    Store.init();
    MapModule.init();
    FilterEngine.init();
    Drawer.init();
    this.initTheme();
    this.bindEvents();

    const ok = await dataPromise;
    if (!ok) {
      document.getElementById('results-count-label').textContent = 'Data failed to load';
      document.getElementById('cards-container').innerHTML = '<div class="empty-msg">Could not load data.json. Make sure it sits next to index.html.</div>';
      return;
    }
    this.populateDropdowns();
    this.updateCounts();
    this.applyFilters();
  },

  initTheme() {
    document.getElementById('theme-toggle').addEventListener('click', () => {
      const dark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem(Config.storageKeyTheme, dark ? 'dark' : 'light'); } catch (e) {}
    });
  },

  bindEvents() {
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        this.setTab(btn.dataset.tab);
      });
    });

    // One delegated listener for all result cards
    document.getElementById('cards-container').addEventListener('click', e => {
      const card = e.target.closest('.record-card');
      if (!card) return;
      const record = Store.byId.get(card.dataset.id);
      if (!record) return;
      Drawer.open(record);
    });

    // Cards are rendered in batches; the next batch is added when the list is scrolled near the end
    const cc = document.getElementById('cards-container');
    cc.addEventListener('scroll', () => {
      if (cc.scrollTop + cc.clientHeight >= cc.scrollHeight - 600) this.appendCards();
    }, { passive: true });
  },

  setTab(tab) {
    this.activeTab = tab;
    const isTracker = tab === 'tracker';
    document.getElementById('explorer-view').style.display = isTracker ? 'none' : 'flex';
    document.getElementById('tracker-view').style.display = isTracker ? 'flex' : 'none';
    document.querySelector('.filter-bar').style.display = isTracker ? 'none' : 'flex';

    if (isTracker) this.renderTracker();
    else {
      this.applyFilters();
      requestAnimationFrame(() => MapModule.map.invalidateSize());
    }
  },

  populateDropdowns() {
    const { universities, openings, supervisors } = Store.dataset;
    const countrySelect = document.getElementById('country-select');
    const subfieldSelect = document.getElementById('subfield-select');
    const addOptions = (select, values) => {
      const frag = document.createDocumentFragment();
      values.forEach(v => { const o = document.createElement('option'); o.value = o.textContent = v; frag.appendChild(o); });
      select.appendChild(frag);
    };

    addOptions(countrySelect, [...new Set(universities.map(u => u.country).filter(Boolean))].sort());

    const subfields = new Set();
    [universities, openings, supervisors].forEach(list => list.forEach(x => (x.subfields || []).forEach(s => subfields.add(s))));
    addOptions(subfieldSelect, [...subfields].sort());
  },

  updateCounts() {
    const { openings, universities, supervisors } = Store.dataset;
    document.getElementById('count-openings').textContent = openings.length;
    document.getElementById('count-universities').textContent = universities.length;
    document.getElementById('count-supervisors').textContent = supervisors.length;
    document.getElementById('count-tracker').textContent = Object.values(Store.tracker).filter(e => e.status && e.status !== 'none').length;
  },

  applyFilters() {
    if (this.activeTab === 'tracker') return;
    const raw = Store.dataset[this.activeTab] || [];
    this.filteredRecords = FilterEngine.filterRecords(raw, this.activeTab);
    this.sortTrackedFirst();
    document.getElementById('results-count-label').textContent = `Showing ${this.filteredRecords.length} of ${raw.length} ${this.activeTab}`;
    this.renderCards(this.filteredRecords);
    MapModule.renderMarkers(this.filteredRecords, this.activeTab);
  },

  // Tracked records float to the top; the sort is stable so other order is kept
  sortTrackedFirst() {
    const t = r => { const e = Store.tracker[r.id]; return e && e.status && e.status !== 'none' ? 1 : 0; };
    this.filteredRecords.sort((a, b) => t(b) - t(a));
  },

  refreshCards() {
    if (this.activeTab === 'tracker') return;
    this.sortTrackedFirst();
    this.renderCards(this.filteredRecords, Math.max(this.rendered, this.CARD_BATCH));
  },

  renderCards(records, count = this.CARD_BATCH) {
    const container = document.getElementById('cards-container');
    if (!records.length) {
      container.innerHTML = `<div class="empty-msg">No ${this.activeTab} found matching your filters.</div>`;
      return;
    }

    this.rendered = Math.min(count, records.length);
    container.innerHTML = records.slice(0, this.rendered).map(r => this.cardHtml(r)).join('');
  },

  appendCards() {
    const recs = this.filteredRecords;
    if (this.rendered >= recs.length) return;
    const next = recs.slice(this.rendered, this.rendered + this.CARD_BATCH);
    this.rendered += next.length;
    document.getElementById('cards-container').insertAdjacentHTML('beforeend', next.map(r => this.cardHtml(r)).join(''));
  },

  cardHtml(r) {
    {
      const uni = Utils.getUniversity(r);
      const stageKey = Store.tracker[r.id]?.status;
      const stage = stageKey && stageKey !== 'none' ? Config.stages.find(s => s.key === stageKey) : null;
      let deadline = '';
      if ('deadline' in r && r.deadline) {
        const n = Utils.daysLeft(r.deadline);
        const cls = n < 0 ? 'deadline-passed' : n <= 7 ? 'deadline-urgent' : 'deadline-open';
        deadline = `<span class="tag ${cls}">📅 ${Utils.escape(r.deadline)} · ${Utils.daysLeftText(r.deadline)}</span>`;
      }
      const stageBadge = stageKey && stageKey !== 'none'
        ? `<span class="tag stage-badge">★ ${Utils.escape(stage ? stage.label : stageKey)}</span>` : '';

      return `
        <div class="record-card" data-id="${Utils.escape(r.id)}">
          <div class="card-title">${Utils.escape(r.title || r.name)}</div>
          <div class="card-uni">🏛 ${uni ? Utils.escape(uni.name) : ''} · ${Utils.escape(uni?.country || '')}</div>
          <div class="tag-row">
            ${deadline}${stageBadge}
            ${(r.subfields || []).slice(0, 3).map(s => `<span class="tag">${Utils.escape(s)}</span>`).join('')}
          </div>
        </div>`;
    }
  },

  renderTracker() {
    if (this.activeTab !== 'tracker') return; // board is rebuilt when the tab is opened
    const board = document.getElementById('kanban-board');
    const tracked = Object.entries(Store.tracker)
      .filter(([, e]) => e.status && e.status !== 'none')
      .map(([id, entry]) => {
        const record = Store.byId.get(id) || { id, title: id };
        return { id, entry, record, uni: Utils.getUniversity(record) };
      });

    const countOf = (...keys) => tracked.filter(i => keys.includes(i.entry.status)).length;
    document.getElementById('metric-total').textContent = tracked.length;
    document.getElementById('metric-contacted').textContent = countOf('emailed', 'replied');
    document.getElementById('metric-interviews').textContent = countOf('interview');
    document.getElementById('metric-offers').textContent = countOf('offer');

    board.innerHTML = Config.stages.map(stg => {
      const items = tracked.filter(i => i.entry.status === stg.key);
      return `
        <div class="kanban-col" data-stage="${stg.key}">
          <div class="kanban-col-head">
            <span style="color:${stg.color}">● ${stg.label}</span>
            <span style="font-family:var(--font-mono);color:var(--text-subtle)">${items.length}</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            ${items.map(i => `
              <div class="kanban-card" draggable="true" data-id="${Utils.escape(i.id)}"${i.record._t ? ` data-type="${i.record._t}"` : ''}>
                ${i.record._t ? `<div class="kanban-type">${TYPE_LABEL[i.record._t]}</div>` : ''}
                <strong style="font-size:12px;line-height:1.3">${Utils.escape(i.record.title || i.record.name || i.id)}</strong>
                <div style="font-size:11px;color:var(--text-muted)">${i.uni ? Utils.escape(i.uni.name) : ''}</div>
                ${i.entry.follow ? `<div style="font-family:var(--font-mono);font-size:10px;color:var(--amber)">⏰ Follow: ${Utils.escape(i.entry.follow)}</div>` : ''}
                <div class="kanban-actions">
                  <button class="btn-kanban" data-action="details" data-id="${Utils.escape(i.id)}">Details</button>
                  <button class="btn-kanban btn-remove-stage" data-action="remove" data-id="${Utils.escape(i.id)}" title="Remove from application stage">🗑 Remove</button>
                </div>
              </div>`).join('')}
          </div>
        </div>`;
    }).join('');

    board._tracked = tracked;
    if (!board._bound) {
      board._bound = true;
      const clearOver = () => board.querySelectorAll('.drag-over').forEach(c => c.classList.remove('drag-over'));

      board.addEventListener('dragstart', e => {
        const card = e.target.closest('.kanban-card');
        if (!card) return;
        e.dataTransfer.setData('text/plain', card.dataset.id);
        e.dataTransfer.effectAllowed = 'move';
        card.classList.add('dragging');
      });
      board.addEventListener('dragend', e => {
        e.target.closest?.('.kanban-card')?.classList.remove('dragging');
        clearOver();
      });
      board.addEventListener('dragover', e => {
        const col = e.target.closest('.kanban-col');
        if (!col) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        if (!col.classList.contains('drag-over')) { clearOver(); col.classList.add('drag-over'); }
      });
      board.addEventListener('dragleave', e => {
        const col = e.target.closest('.kanban-col');
        if (col && !col.contains(e.relatedTarget)) col.classList.remove('drag-over');
      });
      board.addEventListener('drop', e => {
        const col = e.target.closest('.kanban-col');
        if (!col) return;
        e.preventDefault();
        clearOver();
        const id = e.dataTransfer.getData('text/plain');
        const stage = col.dataset.stage;
        if (id && Store.tracker[id] && Store.tracker[id].status !== stage) Store.updateStage(id, stage);
      });
      board.addEventListener('click', e => {
        const btn = e.target.closest('.btn-kanban');
        if (!btn) return;
        const id = btn.dataset.id;
        if (btn.dataset.action === 'remove') Store.updateStage(id, 'none');
        else {
          const item = board._tracked.find(i => i.id === id);
          if (item) Drawer.open(item.record);
        }
      });
    }
  }
};

window.addEventListener('DOMContentLoaded', () => App.init());
</script>
</body>
</html>
