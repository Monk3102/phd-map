<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
:root{--bg:#f4f4f1;--fg:#1c1c1a;--mut:#6b6b64;--card:#fff;--bd:#e2e0d8;--soft:#f0efea;--r:10px;--ac:#2563eb;--ok:#15803d;--warn:#b45309;--bad:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#161614;--fg:#ecebe6;--mut:#9d9c94;--card:#212120;--bd:#383835;--soft:#2a2a28;--ac:#7db2ff;--ok:#4ade80;--warn:#fbbf24;--bad:#f87171}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.45 system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column}
button,select,input,textarea{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:6px 10px;min-height:34px}
button{cursor:pointer}button:hover{background:var(--soft)}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
/* header */
header{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;padding:8px 14px;background:var(--card);border-bottom:1px solid var(--bd)}
.brand{font-weight:700;font-size:17px}
.seg{display:flex;background:var(--soft);border-radius:9px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;min-height:30px;padding:3px 12px;border-radius:7px;color:var(--mut)}
.seg button.on{background:var(--c);color:var(--t);font-weight:600}
#q{flex:1;min-width:150px;max-width:420px}
.menu{position:relative}.menu summary{list-style:none;cursor:pointer;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;min-height:34px;display:flex;align-items:center}
.menu summary::-webkit-details-marker{display:none}
.mp{position:absolute;right:0;top:40px;background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:6px;display:flex;flex-direction:column;gap:4px;z-index:1300;box-shadow:0 6px 20px #0003;min-width:160px}
#ban{padding:8px 14px;background:#fde68a;color:#111}
/* layout */
main{flex:1;min-height:0;display:grid;grid-template-columns:1fr 420px}
#map{background:#cfd8e3;min-height:280px}
#side{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--bd);background:var(--bg)}
#filters{padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;flex-direction:column;gap:8px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fr select{width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tg{border-radius:999px;padding:3px 11px;min-height:28px;font-size:13px;color:var(--mut)}
.tg.on{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:600}
@media(prefers-color-scheme:dark){.tg.on{color:#111}}
#bar{display:flex;justify-content:space-between;align-items:center;padding:8px 14px 2px;color:var(--mut);font-size:13px}
#bar b{color:var(--fg)}
.lnk{background:none;border:0;color:var(--ac);padding:0;min-height:0;cursor:pointer}
#list{overflow:auto;flex:1;padding:6px 10px 10px}
#foot{padding:6px 14px;font-size:11px;color:var(--mut);border-top:1px solid var(--bd);background:var(--card)}
.empty{padding:20px;color:var(--mut);text-align:center}
/* cards */
.card{margin:6px 0;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-left:4px solid var(--c);border-radius:var(--r);cursor:pointer}
.card:hover,.card.sel{border-color:var(--c);box-shadow:0 1px 8px #0002}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.ct b{font-weight:600;line-height:1.3}
.cs{color:var(--mut);font-size:12.5px;margin-top:2px}
.cf{font-size:12.5px;margin-top:6px;color:var(--mut);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
.bd{display:inline-block;font-size:11.5px;padding:1px 8px;border-radius:999px;background:var(--soft);color:var(--mut);white-space:nowrap;font-weight:500}
.bd.red{background:var(--bad);color:#fff}.bd.amb{background:#f59e0b;color:#111}.bd.grn{background:var(--ok);color:#fff}.bd.fp{background:#ede9fe;color:#4c1d95}.bd.org{background:#f97316;color:#111}.bd.grey{opacity:.65}
@media(prefers-color-scheme:dark){.bd.grn{color:#111}}
/* drawer */
#dr{position:fixed;top:0;right:0;bottom:0;width:440px;max-width:100%;background:var(--card);z-index:1200;box-shadow:0 0 24px #0006;display:flex;flex-direction:column;border-top:4px solid var(--c)}
#dh{padding:14px 16px 0;border-bottom:1px solid var(--bd)}
.kind{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--c);font-weight:700}
#dh h2{margin:2px 0 2px;font-size:19px;line-height:1.25;padding-right:36px}
#xd{position:absolute;top:12px;right:12px;width:32px;padding:0;border-radius:50%}
.sub{color:var(--mut);font-size:13px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);text-decoration:none;color:var(--fg);font-weight:600;font-size:13px;background:var(--card)}
.btn.pri{background:var(--c);border-color:var(--c);color:var(--t)}
.dtabs{display:flex;gap:4px}
.dtabs button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;color:var(--mut);padding:6px 12px}
.dtabs button.on{color:var(--fg);border-color:var(--c);font-weight:600}
#db{flex:1;overflow:auto;padding:14px 16px 24px}
.sec{margin-bottom:16px}
.sec h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.facts{background:var(--soft);border-radius:var(--r);padding:4px 12px}
.fact{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.fact:last-child{border:0}
.fact span{color:var(--mut);font-size:12.5px}
.txt{white-space:pre-wrap}
#db a{color:var(--ac);word-break:break-word}
.rl{display:flex;flex-direction:column;gap:4px}
.rl a{padding:7px 10px;border:1px solid var(--bd);border-radius:8px;text-decoration:none;color:var(--fg)}
.rl a:hover{background:var(--soft)}
#db label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:10px}
#db textarea,#db select,#db input{width:100%;margin-top:3px}
.ti{display:block;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;margin-bottom:6px;text-decoration:none;color:var(--fg)!important}
.ti small{color:var(--mut);display:block}
/* popup */
.leaflet-popup-content{margin:12px 14px;min-width:220px}
.ph{font-weight:700;margin-bottom:6px}
.pr{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:5px 0;border-top:1px solid var(--bd)}
.pr a.t{color:#2563eb;text-decoration:none;flex:1}
.pr a.t:hover{text-decoration:underline}
.pr a.x,.pb a{color:#2563eb;font-weight:600;text-decoration:none;white-space:nowrap}
.pb{display:flex;gap:12px;flex-wrap:wrap;margin-top:4px}
.leaflet-tooltip.cnt{background:transparent;border:0;box-shadow:none;color:#111;font-weight:700}
.leaflet-tooltip.cnt:before{display:none}
@media(max-width:850px){
main{grid-template-columns:1fr;grid-template-rows:38vh minmax(0,1fr)}
#side{border-left:0;border-top:1px solid var(--bd)}
#dr{top:auto;left:0;width:auto;height:82vh;border-radius:14px 14px 0 0}}
</style></head><body>
<header>
 <div class="brand">PhD Map</div>
 <nav id="tabs" class="seg"></nav>
 <input id="q" type="search" placeholder="Search names, groups, cities, topics">
 <button id="bt">My Tracker</button>
 <details class="menu" id="bk"><summary>Backup</summary><div class="mp"><button id="be">Export backup</button><button id="bi">Import backup</button></div></details>
 <input id="fi" type="file" accept=".json" hidden>
</header>
<div id="ban" hidden></div>
<main>
 <div id="map"></div>
 <section id="side">
  <div id="filters"></div>
  <div id="bar"></div>
  <div id="list"></div>
  <div id="foot"></div>
 </section>
</main>
<aside id="dr" hidden></aside>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
"use strict";
var $=function(s){return document.querySelector(s)};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var VIEWS={openings:['Openings','#F59E0B','#111','opening'],universities:['Universities','#3B82F6','#fff','university'],supervisors:['Supervisors','#10B981','#fff','supervisor']};
var STATUS=[['none','Not contacted'],['emailed','Emailed'],['replied','Replied'],['interview','Interview'],['offer','Offer'],['declined','Declined']];
var PT={structured:'Structured programme',direct:'Direct PhD',both:'Structured or direct'};
var TK='phdmap.tracker.v1';
var D={universities:[],supervisors:[],openings:[]},view='openings',cur=null,dtab='d';
var F={country:'',topic:'',hideClosed:true,funded:false,taking:false};
var T={};
try{T=JSON.parse(localStorage.getItem(TK))||{}}catch(e){T={}}
function saveT(){try{localStorage.setItem(TK,JSON.stringify(T))}catch(e){}}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function days(d){return Math.round((Date.parse(d)-Date.parse(today()))/864e5)}
function uniOf(r){return r.lat!=null?r:(D.universities.find(function(u){return u.id===r.universityId})||{})}
function byId(id){return D.openings.concat(D.universities,D.supervisors).find(function(r){return r.id===id})}
function typeOf(r){return D.openings.indexOf(r)>=0?'openings':D.universities.indexOf(r)>=0?'universities':'supervisors'}
function title(r){return r.title||r.name||r.id}
function topics(r){return r.subfields||[]}
function isUrl(u){return/^https?:\/\//.test(u||'')}
function deadline(r){
 if(r.status==='closed'||(r.deadline&&days(r.deadline)<0))return['Closed','grey',3];
 if(!r.deadline)return['Rolling','',2];
 var n=days(r.deadline);
 return[n===0?'Due today':n+(n===1?' day left':' days left'),n<14?'red':'amb',1]}
function hostOf(u){return String(u).replace(/^https?:\/\/(www\.)?/,'').split('/')[0]}
/* the one page each record should link to */
function mainLink(r,t){var u=uniOf(r),x;
 if(t==='supervisors')x=[r.staffPageUrl,r.sourceUrl,u.phdProgramUrl];
 else if(t==='universities')x=[r.phdProgramUrl,r.sourceUrl,r.url];
 else x=[r.sourceUrl,r.applyUrl,u.phdProgramUrl];
 for(var i=0;i<x.length;i++)if(isUrl(x[i]))return x[i];return''}
var LBL={supervisors:'Staff page',universities:'Astrophysics programme page',openings:'Listing page'};

/* ---------- map ---------- */
var map=L.map('map',{minZoom:3,maxBounds:[[28,-32],[74,52]]}).setView([52,12],4);
var tileFails=0,tl,usingFallback=false;
function addTiles(url,att){
 if(tl)tl.remove();tileFails=0;
 tl=L.tileLayer(url,{attribution:att,maxZoom:15}).addTo(map);
 tl.on('tileerror',function(){tileFails++;
  if(tileFails===6&&!usingFallback){usingFallback=true;
   addTiles('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}','Tiles &copy; Esri')}})}
addTiles('https://tile.openstreetmap.org/{z}/{x}/{y}.png','&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors');
var layer=L.layerGroup().addTo(map);

/* ---------- filtering ---------- */
function items(){
 var q=($('#q').value||'').toLowerCase();
 var a=D[view].filter(function(r){
  var u=uniOf(r);
  if(F.country&&u.country!==F.country)return false;
  if(F.topic&&topics(r).indexOf(F.topic)<0&&!(view==='openings'&&topics(u).indexOf(F.topic)>=0))return false;
  if(F.funded&&view!=='universities'&&!r.fundedProject)return false;
  if(F.taking&&view==='supervisors'&&r.takingStudents!=='yes')return false;
  if(view==='openings'&&F.hideClosed&&deadline(r)[2]===3)return false;
  if(q&&[title(r),r.group,u.name,u.city,u.country,topics(r).join(' ')].join(' ').toLowerCase().indexOf(q)<0)return false;
  return true});
 if(view==='openings')a.sort(function(x,y){var k=deadline(x)[2]-deadline(y)[2];return k||String(x.deadline).localeCompare(String(y.deadline))});
 else a.sort(function(x,y){return title(x).localeCompare(title(y))});
 return a}
function filtersActive(){return F.country||F.topic||F.funded||F.taking||$('#q').value||(view==='openings'&&!F.hideClosed)}

function renderFilters(){
 var uniq=function(a){return a.filter(function(v,i){return v&&a.indexOf(v)===i}).sort()};
 var countries=uniq(D.universities.map(function(u){return u.country}));
 var tops=uniq([].concat.apply([],D.universities.concat(D.supervisors).map(topics)));
 var opt=function(a,sel,all){return'<option value="">'+all+'</option>'+a.map(function(x){return'<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>'}).join('')};
 var tg=function(id,on,label){return'<button class="tg'+(on?' on':'')+'" data-t="'+id+'" aria-pressed="'+on+'">'+label+'</button>'};
 $('#filters').innerHTML=
  '<div class="fr"><select id="fc" aria-label="Country">'+opt(countries,F.country,'All countries')+'</select>'+
  '<select id="ft" aria-label="Topic">'+opt(tops,F.topic,'All topics')+'</select></div>'+
  '<div class="chips">'+
  (view==='openings'?tg('hideClosed',F.hideClosed,'Hide closed'):'')+
  (view!=='universities'?tg('funded',F.funded,'Funded project'):'')+
  (view==='supervisors'?tg('taking',F.taking,'Taking students'):'')+
  '</div>'}
$('#filters').addEventListener('change',function(e){
 if(e.target.id==='fc')F.country=e.target.value;
 else if(e.target.id==='ft')F.topic=e.target.value;
 render()});
$('#filters').addEventListener('click',function(e){
 var k=e.target.getAttribute('data-t');if(!k)return;
 F[k]=!F[k];renderFilters();render()});
$('#bar').addEventListener('click',function(e){
 if(e.target.id==='fx'){F={country:'',topic:'',hideClosed:true,funded:false,taking:false};$('#q').value='';renderFilters();render()}});
var qt;$('#q').addEventListener('input',function(){clearTimeout(qt);qt=setTimeout(render,150)});

/* ---------- cards ---------- */
function statusChip(id){var t=T[id];if(!t||!t.status||t.status==='none')return'';
 var s=STATUS.filter(function(x){return x[0]===t.status})[0];return s?'<span class="bd grn">'+s[1]+'</span>':''}
function card(r){
 var u=uniOf(r),sub,right='',foot='',b='';
 if(view==='openings'){var d=deadline(r);right='<span class="bd '+d[1]+'">'+d[0]+'</span>';sub=(u.name||'')+' · '+(u.country||'');foot=r.deadline?'Deadline '+r.deadline:'';}
 else if(view==='universities'){sub=(r.city||'')+', '+(r.country||'');if(r.programType)b+='<span class="bd">'+esc(PT[r.programType]||r.programType)+'</span>'}
 else{sub=[r.group,u.name].filter(Boolean).join(' · ');if(r.takingStudents==='yes')b+='<span class="bd amb">Taking students</span>'}
 if(r.fundedProject)b+='<span class="bd fp">&#9670; Funded</span>';
 if(r.uncertain)b+='<span class="bd org">Verify</span>';
 var t=T[r.id]||{};
 if(t.follow&&days(t.follow)<=0)b+='<span class="bd red">Follow up</span>';
 b+=statusChip(r.id);
 return'<div class="card'+(r.id===cur?' sel':'')+'" data-id="'+esc(r.id)+'" style="--c:'+VIEWS[view][1]+'" tabindex="0"><div class="ct"><b>'+esc(title(r))+'</b>'+right+'</div><div class="cs">'+esc(sub)+'</div>'+(foot?'<div class="cf">'+esc(foot)+'</div>':'')+(b?'<div class="row">'+b+'</div>':'')+'</div>'}

function popup(g,a){
 var pop=document.createElement('div'),n=g.rs.length,ml,h='<div class="ph">'+esc(g.u.name||'')+'</div>';
 if(view==='universities'){
  var r=g.rs[0];ml=mainLink(r,view);
  h+='<div class="pb"><a href="#" data-id="'+esc(r.id)+'">Details</a>'+(ml?'<a href="'+esc(ml)+'" target="_blank" rel="noopener">Astrophysics page &#8599;</a>':'')+'</div>';
  if(n>1)h+='<small>+'+(n-1)+' more here, see the list</small>'}
 else{
  h+=g.rs.slice(0,25).map(function(r){ml=mainLink(r,view);
   var ex=ml?'<a class="x" href="'+esc(ml)+'" target="_blank" rel="noopener" title="'+LBL[view]+'">'+(view==='supervisors'?'Profile':'Listing')+' &#8599;</a>':'';
   return'<div class="pr"><a class="t" href="#" data-id="'+esc(r.id)+'">'+esc(title(r))+'</a>'+ex+'</div>'}).join('');
  if(n>25)h+='<small>+'+(n-25)+' more in the list</small>'}
 pop.innerHTML=h;
 pop.addEventListener('click',function(e){var id=e.target.getAttribute&&e.target.getAttribute('data-id');if(id){e.preventDefault();openD(id)}});
 return pop}

function render(){
 var a=items();
 $('#bar').innerHTML='<span><b>'+a.length+'</b> '+VIEWS[view][0].toLowerCase()+'</span>'+(filtersActive()?'<button class="lnk" id="fx">Clear filters</button>':'');
 $('#list').innerHTML=a.length?a.map(card).join(''):'<p class="empty">Nothing matches.<br>Clear a filter or change the search.</p>';
 layer.clearLayers();
 var groups={};
 a.forEach(function(r){var u=uniOf(r);if(u.lat==null||u.lng==null)return;
  var k=u.lat+','+u.lng;(groups[k]=groups[k]||{u:u,rs:[]}).rs.push(r)});
 var pts=[];
 Object.keys(groups).forEach(function(k){
  var g=groups[k],n=g.rs.length;
  var m=L.circleMarker([g.u.lat,g.u.lng],{radius:Math.min(9+Math.sqrt(n)*3,24),color:'#fff',weight:1.5,fillColor:VIEWS[view][1],fillOpacity:.9});
  m.bindPopup(popup(g),{maxWidth:320});
  if(n>1)m.bindTooltip(String(n),{permanent:true,direction:'center',className:'cnt'});
  m.addTo(layer);pts.push([g.u.lat,g.u.lng])});
 if(pts.length)map.fitBounds(pts,{padding:[30,30],maxZoom:7});
 info()}

function setView(v){
 view=v;cur=null;$('#dr').hidden=true;
 $('#tabs').innerHTML=Object.keys(VIEWS).map(function(k){return'<button data-v="'+k+'" class="'+(k===v?'on':'')+'" style="--c:'+VIEWS[k][1]+';--t:'+VIEWS[k][2]+'">'+VIEWS[k][0]+'</button>'}).join('');
 renderFilters();render()}
$('#tabs').addEventListener('click',function(e){var v=e.target.getAttribute('data-v');if(v)setView(v)});
$('#list').addEventListener('click',function(e){var c=e.target.closest('.card');if(c)openD(c.dataset.id)});
$('#list').addEventListener('keydown',function(e){if(e.key==='Enter'){var c=e.target.closest('.card');if(c)openD(c.dataset.id)}});

/* ---------- detail drawer ---------- */
function chips(a){return'<div class="row" style="margin:0">'+a.map(function(x){return'<span class="bd">'+esc(x)+'</span>'}).join('')+'</div>'}
function fact(l,v){return v?'<div class="fact"><span>'+l+'</span><div>'+v+'</div></div>':''}
function sec(h,body){return body?'<div class="sec"><h4>'+h+'</h4>'+body+'</div>':''}
function lk(h,arr){return arr.length?sec(h,'<div class="rl">'+arr.map(function(x){return'<a href="#" data-id="'+esc(x.id)+'">'+esc(title(x))+'</a>'}).join('')+'</div>'):''}
function ext(u,l){return isUrl(u)?'<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(l||hostOf(u))+' &#8599;</a>':''}

function detailBody(r,t){
 var u=uniOf(r),h='',f='';
 if(t==='openings'){
  var d=deadline(r);
  f=fact('Deadline',r.deadline?esc(r.deadline)+' <span class="bd '+d[1]+'">'+d[0]+'</span>':'<span class="bd">'+d[0]+'</span>')+
    fact('University',esc(u.name||''))+fact('Country',esc(u.country||''))+fact('Posted',esc(r.datePosted))+fact('Funded by',esc(r.fundedProject));
  h=sec('Key info','<div class="facts">'+f+'</div>')+sec('Funding','<div class="txt">'+esc(r.funding)+'</div>')+
    sec('Links','<div class="rl">'+[ext(r.sourceUrl,'Listing page'),ext(r.applyUrl,'Apply'),ext(u.phdProgramUrl,'Programme page')].filter(Boolean).map(function(x){return x.replace('<a ','<a class="ln" ')}).join('')+'</div>');
  h+=lk('University',D.universities.filter(function(x){return x.id===r.universityId}))+lk('Supervisor',D.supervisors.filter(function(s){return s.id===r.supervisorId}))}
 else if(t==='universities'){
  f=fact('Location',esc((r.city||'')+(r.country?', '+r.country:'')))+fact('Route',esc(PT[r.programType]||''));
  h=sec('Key info','<div class="facts">'+f+'</div>')+sec('Funding','<div class="txt">'+esc(r.funding)+'</div>')+sec('Deadlines','<div class="txt">'+esc(r.deadlineNote)+'</div>')+
    sec('Topics',topics(r).length?chips(topics(r)):'')+
    sec('Links','<div class="rl">'+[ext(r.phdProgramUrl,'Programme page'),ext(r.url,'University website'),ext(r.sourceUrl,'Source')].filter(Boolean).join('')+'</div>')+
    lk('Supervisors',D.supervisors.filter(function(s){return s.universityId===r.id}))+lk('Openings',D.openings.filter(function(o){return o.universityId===r.id}))}
 else{
  f=fact('University',esc(u.name||''))+fact('Group',esc(r.group))+fact('Taking students',r.takingStudents==='yes'?'<span class="bd amb">Yes</span>':'Not stated')+fact('Funded by',esc(r.fundedProject));
  h=sec('Key info','<div class="facts">'+f+'</div>')+sec('Notes','<div class="txt">'+esc(r.notes)+'</div>')+sec('Topics',topics(r).length?chips(topics(r)):'')+
    sec('Links','<div class="rl">'+[ext(r.staffPageUrl,'Staff page'),ext(r.sourceUrl,'Source')].filter(Boolean).join('')+'</div>')+
    lk('University',D.universities.filter(function(x){return x.id===r.universityId}))+lk('Openings',D.openings.filter(function(o){return o.supervisorId===r.id}))}
 return h}

function trackerBody(tr){
 return'<label>Status<select id="ts">'+STATUS.map(function(s){return'<option value="'+s[0]+'"'+(s[0]===tr.status?' selected':'')+'>'+s[1]+'</option>'}).join('')+'</select></label>'+
  '<div class="fr"><label>Last contact<input type="date" id="tl" value="'+esc(tr.last||'')+'"></label>'+
  '<label>Follow-up date<input type="date" id="tf" value="'+esc(tr.follow||'')+'"></label></div>'+
  '<label>Notes<textarea id="tn" rows="3" placeholder="Anything worth remembering">'+esc(tr.notes||'')+'</textarea></label>'+
  '<label>Email conversations<textarea id="tc" rows="8" placeholder="Paste email conversations here">'+esc(tr.conv||'')+'</textarea></label><small id="sv" style="color:var(--ok)"></small>'}

function openD(id,tab){
 var r=byId(id);if(!r)return;
 var t=typeOf(r);if(t!==view)setView(t);
 cur=id;dtab=tab||'d';
 var u=uniOf(r),tr=T[id]||{status:'none'},ml=mainLink(r,t),V=VIEWS[t];
 var sub=t==='openings'?[u.name,u.country]:t==='universities'?[r.city,r.country]:[r.group,u.name];
 var dr=$('#dr');dr.style.setProperty('--c',V[1]);dr.style.setProperty('--t',V[2]);
 dr.innerHTML='<div id="dh"><button id="xd" aria-label="Close">&#10005;</button><div class="kind">'+V[3]+'</div><h2>'+esc(title(r))+'</h2>'+
  '<div class="sub">'+esc(sub.filter(Boolean).join(' · '))+'</div>'+
  (r.uncertain?'<div style="margin-top:6px"><span class="bd org">Uncertain, check the official page</span></div>':'')+
  '<div class="acts">'+(ml?'<a class="btn pri" href="'+esc(ml)+'" target="_blank" rel="noopener">'+LBL[t]+' &#8599;</a>':'')+
  (t==='openings'&&isUrl(r.applyUrl)&&r.applyUrl!==ml?'<a class="btn" href="'+esc(r.applyUrl)+'" target="_blank" rel="noopener">Apply &#8599;</a>':'')+'</div>'+
  '<div class="dtabs"><button data-dt="d" class="'+(dtab==='d'?'on':'')+'">Details</button><button data-dt="t" class="'+(dtab==='t'?'on':'')+'">Tracker'+(tr.status&&tr.status!=='none'?' &#8226;':'')+'</button></div></div>'+
  '<div id="db">'+(dtab==='d'?detailBody(r,t)+'<small style="color:var(--mut)">Verified: '+esc(r.verified||'not stated')+'</small>':trackerBody(tr))+'</div>';
 dr.hidden=false;
 if(u.lat!=null)map.flyTo([u.lat,u.lng],Math.max(map.getZoom(),6),{duration:.5});
 var sc=$('#list').scrollTop;render();$('#list').scrollTop=sc}
function closeD(){$('#dr').hidden=true;cur=null;render()}
$('#dr').addEventListener('click',function(e){
 if(e.target.id==='xd'){closeD();return}
 var dt=e.target.getAttribute('data-dt');if(dt&&cur){openD(cur,dt);return}
 var a=e.target.closest('[data-id]');if(a){e.preventDefault();openD(a.dataset.id)}});
$('#dr').addEventListener('input',function(){
 if(!cur||!$('#ts'))return;
 T[cur]={status:$('#ts').value,last:$('#tl').value,follow:$('#tf').value,notes:$('#tn').value,conv:$('#tc').value};
 saveT();$('#sv').textContent='Saved'});
$('#dr').addEventListener('change',function(){if(!cur||!$('#ts'))return;var sc=$('#list').scrollTop;render();$('#list').scrollTop=sc});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('#dr').hidden)closeD()});

/* ---------- My Tracker ---------- */
$('#bt').onclick=function(){
 var es=Object.keys(T).filter(function(k){var t=T[k];return t.status!=='none'||t.notes||t.conv||t.follow||t.last});
 es.sort(function(a,b){return(T[a].follow||'9999').localeCompare(T[b].follow||'9999')});
 var dr=$('#dr');dr.style.setProperty('--c','#8B5CF6');cur=null;
 dr.innerHTML='<div id="dh" style="padding-bottom:12px"><button id="xd" aria-label="Close">&#10005;</button><div class="kind">Your progress</div><h2>My Tracker</h2><div class="sub">'+es.length+' tracked, sorted by follow-up date</div></div><div id="db">'+
  (es.length?es.map(function(id){var r=byId(id),t=T[id],s=STATUS.filter(function(x){return x[0]===t.status})[0];
   var meta=[s&&t.status!=='none'?s[1]:'',t.follow?'follow-up '+t.follow:''].filter(Boolean).join(' · ');
   return r?'<a href="#" class="ti" data-id="'+esc(id)+'"><b>'+esc(title(r))+'</b><small>'+esc(meta||'Notes only')+'</small></a>':'<div class="ti"><b>'+esc(id)+'</b><small>Record no longer listed</small></div>'}).join(''):'<p class="empty">Nothing tracked yet.<br>Open any record and use its Tracker tab.</p>')+'</div>';
 dr.hidden=false};

/* ---------- backup ---------- */
$('#be').onclick=function(){
 var a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify({version:1,tracker:T},null,1)],{type:'application/json'}));
 a.download='phdmap-backup-'+today()+'.json';a.click();
 try{localStorage.setItem('phdmap.lastexport',today())}catch(e){}info();$('#bk').open=false};
$('#bi').onclick=function(){$('#bk').open=false;$('#fi').click()};
$('#fi').onchange=function(e){
 var f=e.target.files[0];if(!f)return;
 var rd=new FileReader();
 rd.onload=function(){try{
  var j=JSON.parse(rd.result);
  if(j.universities){load(j);return}
  if(!j.tracker)throw 0;
  var ks=Object.keys(j.tracker),clash=ks.filter(function(k){return T[k]}),ow=true;
  if(clash.length)ow=confirm(clash.length+' entries already exist. Overwrite them with the backup?');
  ks.forEach(function(k){if(!T[k]||ow)T[k]=j.tracker[k]});saveT();render();
 }catch(err){alert('That file is not a valid PhD Map backup.')}};
 rd.readAsText(f);e.target.value=''};

/* ---------- start ---------- */
function info(){
 var last=null;try{last=localStorage.getItem('phdmap.lastexport')}catch(e){}
 var need=Object.keys(T).length&&(!last||days(last)<-14);
 $('#foot').textContent='Updated '+(D.lastUpdated||'n/a')+' · '+D.universities.length+' universities · '+D.supervisors.length+' supervisors · '+D.openings.length+' openings'+(need?' · Tip: export a backup of your tracker.':'')}
function load(j){
 D={lastUpdated:j.lastUpdated||'',universities:j.universities||[],supervisors:j.supervisors||[],openings:j.openings||[]};
 $('#ban').hidden=true;setView(view)}
setView(view);
fetch('data.json?t='+Date.now()).then(function(r){if(!r.ok)throw 0;return r.json()}).then(load).catch(function(){
 $('#ban').hidden=false;
 $('#ban').textContent='Could not load data.json. Make sure it is in the same folder as index.html, or use Backup, then Import backup to load a data file.'});
</script>
</body></html>
